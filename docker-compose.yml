name: nexus-traffic
# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — the whole stack on one host.
#
# Team Lead quick reference
#   first time:   cp .env.example .env   → fill EVERY change-me value → bash scripts/preflight.sh
#   deploy:       bash scripts/deploy.sh  (git pull --ff-only + docker compose up -d --build + checks)
#   status:       docker compose ps        logs: docker compose logs -f api
#   local stack:  docker compose --profile local up -d --build   → http://localhost:8080/traffic/
#
# Services
#   postgres   the database. NOT published on the host; data in the named volume nexus-traffic-pgdata.
#   migrate    one-shot: bootstraps roles + applies SQL migrations, then exits 0. api waits for it.
#   api        ingest + dashboard API + Socket.io + the public guide. Host port 127.0.0.1:4005 only;
#              the gateway nginx proxies https://nexus.libas.in/traffic/api/ → here
#              (ops/nginx/nexus-traffic.conf).
#   pg-backup  nightly pg_dump at 01:30 IST into ./backups, keeps the newest 14.
#   edge       ONLY with --profile local: a local copy of the gateway on 127.0.0.1:8080.
#   web        the dashboard — arrives in S2 (placeholder block below).
#
# Requires Docker Compose v2.20+ (`docker compose`, not the old `docker-compose` v1).
# There is deliberately NO `version:` key (obsolete in Compose v2).
# ─────────────────────────────────────────────────────────────────────────────

# Every service logs to json-file with rotation, so logs can never fill the disk (10 MB × 5 files).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# One Postgres image for the database AND the backup job (pg_dump must match the server version).
x-pg-image: &pg-image ${PG_IMAGE:-postgres:17-alpine}

services:
  # ─── Database ───────────────────────────────────────────────────────────────
  postgres:
    image: *pg-image
    env_file: .env # reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (first start creates them)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time initdb Postgres listens on the unix socket only,
      # so the check stays red until the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # ─── Migrations (one-shot, runs on every deploy) ────────────────────────────
  migrate:
    image: nexus-traffic-api:local # built by the api service below — never pulled
    pull_policy: never
    command: ['node', 'dist/db/migrate.js']
    environment:
      # Connects as the OWNER (POSTGRES_USER); sets the nexus_app password on every run.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD:?set NEXUS_APP_DB_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    logging: *logging

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nexus-traffic-api:local
    pull_policy: build
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully # a failed migration keeps the old api running
    ports:
      - '127.0.0.1:4005:4000' # loopback only: the gateway nginx on this host proxies to it
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    # Optional fallback for apps whose containers cannot reach https://nexus.libas.in (hairpin DNS):
    # create the network once (`docker network create nexus-ingest`), then uncomment. Their compose
    # joins it and uses NEXUS_URL=http://nexus-traffic-api:4000 (docs/integration/09-environments.md).
    # networks:
    #   default: {}
    #   nexus-ingest:
    #     aliases: [nexus-traffic-api]

  # ─── Web dashboard (added in S2) ────────────────────────────────────────────
  # PLACEHOLDER — uncomment in S2 when apps/web exists. Kept here so the layout is visible now.
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #     args:
  #       NEXT_PUBLIC_SOCKET_PATH: ${NEXT_PUBLIC_SOCKET_PATH:-/traffic/socket.io}
  #   image: nexus-traffic-web:local
  #   pull_policy: build
  #   environment: # allowlist — the web container gets only what it needs
  #     LIBAS_JWT_SECRET: ${LIBAS_JWT_SECRET}
  #     PORTAL_LOGIN_URL: ${PORTAL_LOGIN_URL}
  #     PORTAL_RETURN_PARAM: ${PORTAL_RETURN_PARAM:-return}
  #     PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://nexus.libas.in}
  #     DASHBOARD_ALLOWED_EMAILS: ${DASHBOARD_ALLOWED_EMAILS:-}
  #     DASHBOARD_ALLOWED_DOMAINS: ${DASHBOARD_ALLOWED_DOMAINS:-libas.in}
  #     DASHBOARD_ADMIN_EMAILS: ${DASHBOARD_ADMIN_EMAILS:-}
  #   depends_on:
  #     api:
  #       condition: service_healthy
  #   ports:
  #     - '127.0.0.1:3305:3000'
  #   healthcheck:
  #     test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/traffic/healthz >/dev/null || exit 1']
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 30s
  #   restart: unless-stopped
  #   logging: *logging

  # ─── Nightly backup ─────────────────────────────────────────────────────────
  pg-backup:
    image: *pg-image
    entrypoint: ['/bin/sh', '/ops/backup/run.sh']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./ops/backup:/ops/backup:ro
      - ./backups:/backups # host folder; copy it off the machine regularly
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # ─── Local gateway (profile `local` only — never on the server) ─────────────
  edge:
    profiles: ['local']
    image: nginx:1.27-alpine
    volumes:
      - ./ops/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  pgdata:
    name: nexus-traffic-pgdata # fixed name: survives renaming the folder; NEVER `down -v` in production
