name: nexus-traffic
# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — the whole stack on one host.
#
# WHERE THE DATA LIVES (ADR 0002, ai-context/decisions/0002-external-database.md)
#   production   the EXTERNAL company Postgres server 10.150.0.5 (PostgreSQL 18), database
#                nexus_traffic, schema traffic. NO postgres container runs. .env sets
#                DB_APP_ROLE_MODE=owner and DATABASE_URL = MIGRATION_DATABASE_URL (same login).
#   localdb      profile `localdb`: a postgres:18 container for laptops / CI / rehearsals, with the
#                strict role split (DB_APP_ROLE_MODE=separate → the api runs as nexus_app, DML only).
#
# Team Lead quick reference
#   first time:   cp .env.example .env   → fill EVERY change-me value → bash scripts/preflight.sh
#   deploy:       bash scripts/deploy.sh  (git pull --ff-only + docker compose up -d --build + checks)
#   by hand:      docker compose up -d --build
#                 → against the EXTERNAL database (production; no postgres container)
#   fully local:  docker compose --profile localdb --profile local up -d --build
#                 → local postgres container + gateway copy on http://localhost:8080/traffic/
#                 (check the .env first with: bash scripts/preflight.sh --localdb)
#   status:       docker compose ps        logs: docker compose logs -f api migrate
#
# Services
#   postgres   ONLY with --profile localdb. NOT published on the host; data in the named volume
#              nexus-traffic-pgdata (mounted at /var/lib/postgresql — the PG18 image layout).
#   migrate    one-shot: bootstraps the schema (+ role nexus_app and its grants in 'separate' mode),
#              applies SQL migrations, ensures partitions, exits 0. api waits for it.
#   api        ingest + dashboard API + Socket.io + the public guide. Host port 127.0.0.1:4005 only;
#              the gateway nginx proxies https://nexus.libas.in/traffic/api/ → here
#              (ops/nginx/nexus-traffic.conf).
#   pg-backup  nightly pg_dump of BACKUP_DATABASE_URL (default: MIGRATION_DATABASE_URL) at
#              BACKUP_AT_IST (01:30 IST) into ./backups, keeps the newest BACKUP_KEEP (14).
#              Restore: DEPLOY.md → "Backups and restore".
#   edge       ONLY with --profile local: a local copy of the gateway on 127.0.0.1:8080.
#   web        the dashboard (Next.js, basePath /traffic). Host port 127.0.0.1:3305 only; the gateway
#              nginx proxies https://nexus.libas.in/traffic/ → here. Gets ONLY an env allowlist.
#
# Requires Docker Compose v2.20+ (`docker compose`, not the old `docker-compose` v1). v2.20 is the
# first with `depends_on: … required: false`, which lets migrate/pg-backup run without the postgres
# service. There is deliberately NO `version:` key (obsolete in Compose v2).
# ─────────────────────────────────────────────────────────────────────────────

# Every service logs to json-file with rotation, so logs can never fill the disk (10 MB × 5 files).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

# One Postgres image for the local database AND the backup job. pg_dump must be >= the SERVER's
# major version, and the production server is PostgreSQL 18 → postgres:18-alpine (ADR 0002).
x-pg-image: &pg-image ${PG_IMAGE:-postgres:18-alpine}

services:
  # ─── Local database (profile `localdb` only — production uses 10.150.0.5) ───
  # Production does NOT run this: the data lives on the external server (10.150.0.5, database
  # nexus_traffic, see ADR 0002). For laptops / CI / rehearsals:
  #   docker compose --profile localdb --profile local up -d --build
  postgres:
    profiles: ['localdb']
    image: *pg-image
    env_file: .env # reads POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (first start creates them)
    volumes:
      # The PG18 image keeps PGDATA at /var/lib/postgresql/18/docker and declares its VOLUME at
      # /var/lib/postgresql; its entrypoint REFUSES a mount at the old /var/lib/postgresql/data.
      # A volume initialised by postgres:17 cannot be reused as is: dump/restore it, or on a dev
      # machine run `docker compose --profile localdb --profile local down -v` and start fresh.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-time initdb Postgres listens on the unix socket only,
      # so the check stays red until the real server is up.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # ─── Migrations (one-shot, runs on every deploy) ────────────────────────────
  migrate:
    image: nexus-traffic-api:local # built by the api service below — never pulled
    pull_policy: never
    command: ['node', 'dist/db/migrate.js']
    environment:
      # Connects as the OWNER: the shared login on 10.150.0.5/nexus_traffic (production) or
      # POSTGRES_USER on the localdb postgres service.
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}
      # owner    = external server: no role is created or altered; the api uses the SAME login.
      # separate = localdb: creates nexus_app, sets its password and its DML-only grants every run.
      DB_APP_ROLE_MODE: ${DB_APP_ROLE_MODE:-separate}
      # Required (>= 16 chars) ONLY when DB_APP_ROLE_MODE=separate; ignored in owner mode.
      NEXUS_APP_DB_PASSWORD: ${NEXUS_APP_DB_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false # waits for the local postgres with --profile localdb; else the external DB
    restart: 'no'
    logging: *logging

  # ─── API ────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: nexus-traffic-api:local
    pull_policy: build
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully # a failed migration keeps the old api running
    ports:
      - '127.0.0.1:4005:4000' # loopback only: the gateway nginx on this host proxies to it
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging
    # Optional fallback for apps whose containers cannot reach https://nexus.libas.in (hairpin DNS):
    # create the network once (`docker network create nexus-ingest`), then uncomment. Their compose
    # joins it and uses NEXUS_URL=http://nexus-traffic-api:4000 (docs/integration/09-environments.md).
    # networks:
    #   default: {}
    #   nexus-ingest:
    #     aliases: [nexus-traffic-api]

  # ─── Web dashboard ──────────────────────────────────────────────────────────
  # Next.js standalone, served at /traffic (basePath). The gateway nginx proxies
  # https://nexus.libas.in/traffic/ → here; /traffic/api/ and /traffic/socket.io/ go to the api.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SOCKET_PATH: ${NEXT_PUBLIC_SOCKET_PATH:-/traffic/socket.io}
    image: nexus-traffic-web:local
    pull_policy: build
    environment: # allowlist — the web container gets ONLY what it needs (no DB URL, no peppers)
      LIBAS_JWT_SECRET: ${LIBAS_JWT_SECRET:?set LIBAS_JWT_SECRET in .env}
      PORTAL_LOGIN_URL: ${PORTAL_LOGIN_URL:-https://nexus.libas.in/login}
      PORTAL_RETURN_PARAM: ${PORTAL_RETURN_PARAM:-return}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://nexus.libas.in}
      DASHBOARD_ALLOWED_EMAILS: ${DASHBOARD_ALLOWED_EMAILS:-}
      DASHBOARD_ALLOWED_DOMAINS: ${DASHBOARD_ALLOWED_DOMAINS:-libas.in}
      DASHBOARD_ADMIN_EMAILS: ${DASHBOARD_ADMIN_EMAILS:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:3305:3000' # loopback only: the gateway nginx on this host proxies to it
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/traffic/healthz >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *logging

  # ─── Nightly backup ─────────────────────────────────────────────────────────
  # The shared server may already be backed up by its owners; this is a Nexus-only dump (ADR 0002).
  pg-backup:
    image: *pg-image # pg_dump 18: must be >= the server's major version
    entrypoint: ['/bin/sh', '/ops/backup/run.sh']
    environment:
      # Connection string to dump (owner login); defaults to MIGRATION_DATABASE_URL.
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-${MIGRATION_DATABASE_URL:?set MIGRATION_DATABASE_URL in .env}}
      BACKUP_AT_IST: ${BACKUP_AT_IST:-01:30} # HH:MM IST
      BACKUP_KEEP: ${BACKUP_KEEP:-14} # dump files kept in ./backups
    volumes:
      - ./ops/backup:/ops/backup:ro
      - ./backups:/backups # host folder; copy it off the machine regularly
    depends_on:
      postgres:
        condition: service_healthy
        required: false # only with --profile localdb
    restart: unless-stopped
    logging: *logging

  # ─── Local gateway (profile `local` only — never on the server) ─────────────
  edge:
    profiles: ['local']
    image: nginx:1.27-alpine
    volumes:
      - ./ops/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  # Used only by the localdb postgres. Fixed name: survives renaming the folder.
  # `down -v` deletes it: fine for a laptop rehearsal, NEVER for data you need.
  pgdata:
    name: nexus-traffic-pgdata
