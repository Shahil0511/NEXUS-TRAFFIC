# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — LOCAL copy of the gateway (compose service `edge`, profile `local`).
#
#   docker compose --profile local up -d --build   →   http://localhost:8080/traffic/api/docs/
#
# Same location blocks as ops/nginx/nexus-traffic.conf (keep them in sync), but the upstreams are the
# compose service names (api:4000, web:3000) instead of the host ports 127.0.0.1:4005 / :3305.
# NEVER used on the server.
# ─────────────────────────────────────────────────────────────────────────────

# Resolve compose service names at request time (Docker's embedded DNS), so nginx starts even when
# an upstream container does not exist yet (the web dashboard arrives in S2).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 /traffic/;
    }

    # ─── API ───────────────────────────────────────────────────────────────────
    location ^~ /traffic/api/ {
        set $api_upstream api:4000;
        # With a variable, proxy_pass does not rewrite the URI itself — strip /traffic explicitly.
        rewrite ^/traffic(/api/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ─── Socket.io ─────────────────────────────────────────────────────────────
    location ^~ /traffic/socket.io/ {
        set $api_upstream api:4000;
        rewrite ^/traffic(/socket\.io/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ─── Dashboard — TEMPORARY until S2 ────────────────────────────────────────
    # The web container does not exist in S1, so /traffic/ answers a plain 503 instead of a 502.
    # S2: delete this block and uncomment the real one below.
    location ^~ /traffic/ {
        default_type text/plain;
        return 503 "dashboard arrives in S2\n";
    }

    # ─── Dashboard (S2) ────────────────────────────────────────────────────────
    # location ^~ /traffic/ {
    #     set $web_upstream web:3000;
    #     proxy_pass http://$web_upstream;     # full path /traffic/… kept (Next basePath)
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header Connection "";
    # }
}
