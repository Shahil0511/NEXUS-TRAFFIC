# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — LOCAL copy of the gateway (compose service `edge`, profile `local`).
#
#   docker compose --profile localdb --profile local up -d --build   →   http://localhost:8080/traffic/api/docs/
#   (fully local; drop `--profile localdb` to use the external database from .env)
#
# Same location blocks as ops/nginx/nexus-traffic.conf (keep them in sync), but the upstreams are the
# compose service names (api:4000, web:3000) instead of the host ports 127.0.0.1:4005 / :3305.
# NEVER used on the server.
# ─────────────────────────────────────────────────────────────────────────────

# Resolve compose service names at request time (Docker's embedded DNS), so nginx starts even when
# an upstream container is not up yet (nginx would otherwise refuse to start).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    location = / {
        return 302 /traffic/;
    }

    # ─── API ───────────────────────────────────────────────────────────────────
    location ^~ /traffic/api/ {
        set $api_upstream api:4000;
        # With a variable, proxy_pass does not rewrite the URI itself — strip /traffic explicitly.
        rewrite ^/traffic(/api/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ─── Socket.io ─────────────────────────────────────────────────────────────
    location ^~ /traffic/socket.io/ {
        set $api_upstream api:4000;
        rewrite ^/traffic(/socket\.io/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ─── Dashboard ─────────────────────────────────────────────────────────────
    # Next.js keeps basePath /traffic, so the FULL path is forwarded (no rewrite). The web proxy
    # builds the SSO return URL from PUBLIC_ORIGIN, never from this Host header.
    location ^~ /traffic/ {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }

    # Next serves the basePath root without a trailing slash (/traffic/ → 308 /traffic).
    location = /traffic {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
