# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — location blocks for the nexus.libas.in GATEWAY nginx (ADR 0004).
#
# HOW TO USE (Team Lead):
#   1. Replace NEXUS_HOST:NEXUS_PORT below with the Nexus server and the port you assigned
#      (the NEXUS_PORT in its .env), e.g. 127.0.0.1:8080 when the gateway runs on the same host.
#   2. Paste the three blocks INSIDE the existing `server { … }` block for nexus.libas.in (the TLS one).
#   3. sudo nginx -t && sudo systemctl reload nginx
#
#   https://nexus.libas.in/traffic/…  →  http://NEXUS_HOST:NEXUS_PORT/traffic/…   (path KEPT, nothing stripped)
#   The edge nginx inside the Nexus stack splits it into api / socket.io / dashboard (ops/nginx/edge.conf).
#
# RULES
#  * `^~` makes these prefix matches WIN over regex locations elsewhere in the server block
#    (e.g. `location ~* \.(js|css|png)$` for other apps' static files), so /traffic/_next/static/…
#    is never served by someone else's rule.
#  * NO `auth_request` (or any SSO redirect) on /traffic/: other teams' servers POST ingest events to
#    /traffic/api/ with an API key and must never get a login redirect. If the server block applies
#    auth_request globally, uncomment `auth_request off;` in all three blocks — the dashboard does its
#    own SSO check with the portal's access_token cookie.
#  * Keep `X-Forwarded-For $proxy_add_x_forwarded_for`: the api finds the real user IP in it
#    (TRUST_PROXY_HOPS=2 = this gateway + the edge nginx).
#  * Runbook and acceptance checks: DEPLOY.md (repo root).
# ─────────────────────────────────────────────────────────────────────────────

# ─── Socket.io (live dashboard updates — websocket) ──────────────────────────
location ^~ /traffic/socket.io/ {
    # auth_request off;
    proxy_pass http://NEXUS_HOST:NEXUS_PORT;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Websockets stay open for hours; the default 60 s would drop every idle dashboard.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ─── Everything else: dashboard, API, ingest, public guide ───────────────────
location ^~ /traffic/ {
    # auth_request off;
    # NO URI on proxy_pass: the full path /traffic/… is forwarded unchanged.
    proxy_pass http://NEXUS_HOST:NEXUS_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Server ingest batches are ≤ 512 KiB; 1m leaves headroom and still rejects abuse early.
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}

# Next serves the basePath root WITHOUT a trailing slash (/traffic/ → 308 /traffic), which the
# prefix block above does not match — forward it as well.
location = /traffic {
    # auth_request off;
    proxy_pass http://NEXUS_HOST:NEXUS_PORT;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}
