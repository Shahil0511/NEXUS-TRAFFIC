# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — location blocks for the nexus.libas.in gateway nginx.
#
# HOW TO USE (Team Lead): paste these three blocks INSIDE the existing `server { … }` block for
# nexus.libas.in (the one with the TLS certificate), then:  sudo nginx -t && sudo systemctl reload nginx
#
#   https://nexus.libas.in/traffic/api/…        → api   127.0.0.1:4005  (/traffic stripped → /api/…)
#   https://nexus.libas.in/traffic/socket.io/…  → api   127.0.0.1:4005  (websocket, /traffic stripped)
#   https://nexus.libas.in/traffic/…            → web   127.0.0.1:3305  (path KEPT: Next basePath /traffic)
#
# RULES
#  * `^~` makes these prefix matches WIN over regex locations elsewhere in the server block
#    (e.g. `location ~* \.(js|css|png)$` for other apps' static files), so /traffic/_next/static/…
#    is never served by someone else's rule.
#  * NO `auth_request` (or any SSO redirect) on /traffic/api/: other teams' servers POST ingest events
#    there with an API key and must never get a login redirect. If the server block applies
#    auth_request globally, add `auth_request off;` inside the api and socket.io blocks.
#    The dashboard (/traffic/) does its own SSO check with the portal's access_token cookie.
#  * The api trusts exactly ONE proxy hop (TRUST_PROXY_HOPS=1 in .env) = this nginx.
#  * Ports are bound to 127.0.0.1 by docker compose, so this nginx must run on the same host.
#    (The web block returns 502 until the dashboard container exists — it arrives in S2.)
# ─────────────────────────────────────────────────────────────────────────────

# ─── API (ingest, dashboard REST API, public guide) ──────────────────────────
location ^~ /traffic/api/ {
    # Trailing slash on proxy_pass replaces the matched prefix: /traffic/api/x → /api/x
    proxy_pass http://127.0.0.1:4005/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    # Server ingest batches are ≤ 512 KiB; 1m leaves headroom and still rejects abuse early.
    client_max_body_size 1m;
    proxy_read_timeout 60s;
}

# ─── Socket.io (live dashboard updates) ──────────────────────────────────────
location ^~ /traffic/socket.io/ {
    proxy_pass http://127.0.0.1:4005/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    # Websockets stay open for hours; the default 60 s would drop every idle dashboard.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ─── Dashboard (Next.js, basePath /traffic) ──────────────────────────────────
location ^~ /traffic/ {
    # NO trailing slash/URI on proxy_pass: the full path /traffic/… is forwarded unchanged.
    proxy_pass http://127.0.0.1:3305;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
}
