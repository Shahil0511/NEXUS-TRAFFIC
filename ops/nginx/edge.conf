# ─────────────────────────────────────────────────────────────────────────────
# Data Nexus Traffic — the EDGE nginx (compose service `edge`), the ONE published port (ADR 0004).
#
#   gateway (nexus.libas.in, TLS) ──/traffic/…──▶ edge :${NEXUS_PORT} ──┬─ /traffic/api/…        → api:4000 /api/…
#                                                                   ├─ /traffic/socket.io/…  → api:4000 /socket.io/…
#                                                                   └─ /traffic/…            → web:3000 (path kept)
#
# Production AND local (`docker compose --profile localdb up -d --build` → http://localhost:${NEXUS_PORT}/traffic/).
# The gateway side is ops/nginx/nexus-traffic.conf. Two proxies sit in front of the api (gateway + edge),
# so the api runs with TRUST_PROXY_HOPS=2.
# ─────────────────────────────────────────────────────────────────────────────

# Resolve compose service names at request time (Docker's embedded DNS), so nginx starts even when
# an upstream container is not up yet (nginx would otherwise refuse to start).
resolver 127.0.0.11 valid=10s ipv6=off;

# Keep the scheme the BROWSER used: behind the gateway that is https (its X-Forwarded-Proto);
# hit directly (local) it is this hop's own scheme.
map $http_x_forwarded_proto $nexus_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    # Relative Location headers: an absolute one would name this container's port 80, not the
    # published NEXUS_PORT or the gateway.
    absolute_redirect off;

    location = / {
        return 302 /traffic/;
    }

    # ─── API (ingest, dashboard REST API, public guide) ────────────────────────
    location ^~ /traffic/api/ {
        set $api_upstream api:4000;
        # With a variable, proxy_pass does not rewrite the URI itself — strip /traffic explicitly.
        rewrite ^/traffic(/api/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        proxy_set_header Connection "";
        # Server ingest batches are ≤ 512 KiB; 1m leaves headroom and still rejects abuse early.
        client_max_body_size 1m;
        proxy_read_timeout 60s;
    }

    # ─── Socket.io (live dashboard updates, websocket) ─────────────────────────
    location ^~ /traffic/socket.io/ {
        set $api_upstream api:4000;
        rewrite ^/traffic(/socket\.io/.*)$ $1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        # Websockets stay open for hours; the default 60 s would drop every idle dashboard.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ─── Dashboard (Next.js, basePath /traffic — the FULL path is forwarded) ───
    # The web proxy builds the SSO return URL from PUBLIC_ORIGIN, never from this Host header.
    location ^~ /traffic/ {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        proxy_set_header Connection "";
    }

    # Next serves the basePath root without a trailing slash (/traffic/ → 308 /traffic).
    location = /traffic {
        set $web_upstream web:3000;
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nexus_forwarded_proto;
        proxy_set_header Connection "";
    }
}
